[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flightrisk-vn"
version = "2.0.0"
description = "ScrapeData — Vietnamese Airline Flight Data Mining & Predictive Analytics Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.1.0",
    "catboost>=1.2.0",
    "scipy>=1.12.0",
    "joblib>=1.3.0",
    "mlxtend>=0.23.0",
    "holidays>=0.40",
]

[project.optional-dependencies]
ingestion = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
]
analytics = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "shap>=0.46.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]
all = [
    "flightrisk-vn[ingestion,analytics,api,dev]",
]

[project.scripts]
flightrisk = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flight_delay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"
markers = [
    "browser: Playwright end-to-end browser UI tests",
    "slow: Model training or heavy integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
