schema_version: "2.0"

feature_groups:
  categorical_model_inputs:
    - name: airline_code
      group: Airline
      dtype: category
      formula: "IATA 2-char carrier code (VN, VJ, QH, BL, VU, 0V, 9G)"
      source: silver_schedule
      missing_policy: "Impute string 'missing'; OneHotEncoder(handle_unknown='ignore')"
      available_before_prediction: true
      leakage_risk: low
    - name: airport
      group: Airport
      dtype: category
      formula: "Observed departure/arrival airport IATA code"
      source: silver_schedule
      missing_policy: "Impute string 'missing'; OneHotEncoder(handle_unknown='ignore')"
      available_before_prediction: true
      leakage_risk: low
    - name: direction
      group: Operational
      dtype: category
      formula: "DEPARTURES or ARRIVALS"
      source: silver_schedule
      missing_policy: "Impute string 'missing'"
      available_before_prediction: true
      leakage_risk: low
    - name: route_type
      group: Operational
      dtype: category
      formula: "'domestic' if origin & destination in VN_AIRPORTS else 'international'"
      source: silver_schedule
      missing_policy: "Impute string 'missing'"
      available_before_prediction: true
      leakage_risk: low
    - name: carrier_category
      group: Airline
      dtype: category
      formula: "FSC / LCC / HYBRID / TOURIST / REGIONAL / SEAPLANE from CARRIER_TYPE map"
      source: airlines_config
      missing_policy: "Fallback 'OTHER'"
      available_before_prediction: true
      leakage_risk: low

  numeric_model_inputs:
    - name: airport_load
      group: Operational
      dtype: float
      formula: "Count of scheduled flights across all airlines in (airport, scheduled_hour_floor)"
      source: timetable_aggregation
      missing_policy: "Train median imputation"
      available_before_prediction: true
      leakage_risk: medium
    - name: precipitation
      group: Weather
      dtype: float
      formula: "Hourly precipitation (mm) at (airport, hour_floor)"
      source: open_meteo
      missing_policy: "Default 0.0 / Train median"
      available_before_prediction: true
      leakage_risk: time_dependent
    - name: wind_gusts_10m
      group: Weather
      dtype: float
      formula: "Hourly wind gusts 10m (km/h) at (airport, hour_floor)"
      source: open_meteo
      missing_policy: "Default 10.0 / Train median"
      available_before_prediction: true
      leakage_risk: time_dependent
    - name: visibility
      group: Weather
      dtype: float
      formula: "Hourly horizontal visibility (m) at (airport, hour_floor)"
      source: open_meteo
      missing_policy: "Default 10000.0 / Train median"
      available_before_prediction: true
      leakage_risk: time_dependent
    - name: weather_hazard_score
      group: Weather
      dtype: float
      formula: "0.35*clip(precip/10)+0.25*clip((wind-15)/45)+0.20*clip((10000-vis)/10000)+0.20*is_storm"
      source: engineered
      missing_policy: "Bounded in [0, 1]; Train median"
      available_before_prediction: true
      leakage_risk: time_dependent
    - name: load_x_weather
      group: Operational
      dtype: float
      formula: "airport_load * weather_hazard_score"
      source: engineered
      missing_policy: "Train median"
      available_before_prediction: true
      leakage_risk: medium
    - name: hour_sin
      group: Temporal
      dtype: float
      formula: "sin(2 * pi * scheduled_hour_num / 24)"
      source: engineered
      missing_policy: "Fallback scheduled_hour_num=12.0"
      available_before_prediction: true
      leakage_risk: low
    - name: hour_cos
      group: Temporal
      dtype: float
      formula: "cos(2 * pi * scheduled_hour_num / 24)"
      source: engineered
      missing_policy: "Fallback scheduled_hour_num=12.0"
      available_before_prediction: true
      leakage_risk: low
    - name: dow_sin
      group: Temporal
      dtype: float
      formula: "sin(2 * pi * dayofweek / 7)"
      source: engineered
      missing_policy: "Fallback dayofweek=2"
      available_before_prediction: true
      leakage_risk: low
    - name: dow_cos
      group: Temporal
      dtype: float
      formula: "cos(2 * pi * dayofweek / 7)"
      source: engineered
      missing_policy: "Fallback dayofweek=2"
      available_before_prediction: true
      leakage_risk: low
    - name: historical_airline_delay_rate
      group: Historical
      dtype: float
      formula: "Causal smoothed delayed+cancelled rate of airline strictly from flights with outcome before prediction_time (m-estimate=20)"
      source: causal_history
      missing_policy: "Global causal prior / Train median"
      available_before_prediction: true
      leakage_risk: high_if_miscomputed
    - name: historical_airport_delay_rate
      group: Historical
      dtype: float
      formula: "Causal smoothed delayed+cancelled rate at airport strictly before prediction_time (m-estimate=20)"
      source: causal_history
      missing_policy: "Global causal prior / Train median"
      available_before_prediction: true
      leakage_risk: high_if_miscomputed
    - name: airport_congestion
      group: Operational
      dtype: float
      formula: "Ratio airport_load / causal_median_airport_load (relative congestion index)"
      source: engineered
      missing_policy: "Default 1.0 / Train median"
      available_before_prediction: true
      leakage_risk: medium

  binary_passthrough_inputs:
    - {name: is_peak_hour, group: Temporal, dtype: int, formula: "1 if 6.0<=hour<=9.5 or 17.0<=hour<=20.5", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: low}
    - {name: is_heavy_traffic, group: Operational, dtype: int, formula: "1 if airport_load > 28", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: low}
    - {name: is_rain, group: Weather, dtype: int, formula: "1 if precipitation > 0.1", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: time_dependent}
    - {name: is_heavy_rain, group: Weather, dtype: int, formula: "1 if precipitation > 2.5", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: time_dependent}
    - {name: is_high_wind, group: Weather, dtype: int, formula: "1 if wind_gusts_10m > 30.0", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: time_dependent}
    - {name: is_severe_wind, group: Weather, dtype: int, formula: "1 if wind_gusts_10m > 50.0", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: time_dependent}
    - {name: is_low_vis, group: Weather, dtype: int, formula: "1 if visibility < 5000.0", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: time_dependent}
    - {name: is_storm, group: Weather, dtype: int, formula: "1 if weather_code >= 95", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: time_dependent}
    - {name: is_golden_triangle, group: Operational, dtype: int, formula: "1 if (origin, destination) in GOLDEN_TRIANGLE", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: low}
    - {name: is_holiday_flag, group: Temporal, dtype: int, formula: "1 if VN public holiday", source: holidays_vn, missing_policy: "0", available_before_prediction: true, leakage_risk: low}
    - {name: is_weekend_flag, group: Temporal, dtype: int, formula: "1 if dayofweek >= 5", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: low}
    - {name: is_domestic_flag, group: Operational, dtype: int, formula: "1 if route_type == 'domestic'", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: low}
    - {name: is_departure, group: Operational, dtype: int, formula: "1 if direction == 'DEPARTURES'", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: low}
    - {name: peak_x_rain, group: Operational, dtype: int, formula: "is_peak_hour * is_rain", source: engineered, missing_policy: "0", available_before_prediction: true, leakage_risk: time_dependent}

  auxiliary_analytical_only:
    - {name: scheduled_hour_num, group: Temporal, dtype: float, formula: "hour + minute/60.0 (used in EDA/cyclical transform)", source: engineered, missing_policy: "12.0", available_before_prediction: true, leakage_risk: low}
    - {name: weather_code, group: Weather, dtype: int, formula: "WMO weather code (mapped to is_storm & hazard)", source: open_meteo, missing_policy: "0", available_before_prediction: true, leakage_risk: time_dependent}
    - {name: time_slot, group: Temporal, dtype: category, formula: "00h-06h / 06h-12h / 12h-18h / 18h-24h", source: silver_schedule, missing_policy: "06h-12h", available_before_prediction: true, leakage_risk: low}
    - {name: day_type, group: Temporal, dtype: category, formula: "weekday / weekend", source: silver_schedule, missing_policy: "weekday", available_before_prediction: true, leakage_risk: low}
    - {name: is_holiday, group: Temporal, dtype: bool, formula: "Vietnam holiday boolean", source: holidays_vn, missing_policy: "false", available_before_prediction: true, leakage_risk: low}
