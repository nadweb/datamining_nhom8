name: Automated Tests & Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ml.txt
          pip install pytest httpx
      - name: Verify package imports
        run: python -c "import sys; sys.path.insert(0, 'src'); import flight_delay; from flight_delay.data_mining import leakage_guard; print('Imports OK')"
      - name: Run data-independent unit, contract & leakage guard tests
        run: |
          pytest -v -p no:cacheprovider \
            tests/unit/test_config_and_contracts.py \
            tests/unit/test_iata_and_labels.py \
            tests/unit/test_feature_engineering.py \
            tests/unit/test_leakage_guard.py
